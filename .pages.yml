media:
  input: content/images
  output: /blog/content/images
  categories: [image]
  rename: safe
content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    format: yaml-frontmatter
    operations:
      create: true
      rename: true
      delete: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: category
        label: 分类
        type: string
      - name: summary
        label: 摘要
        type: text
      - name: coverImage
        label: 封面图片
        type: image
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          path: content/images

